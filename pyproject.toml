[project]
name = "router"
version = "0.1.0"
description = "Roteador que indica qual modelo Claude usar para cada prompt"
requires-python = ">=3.11"
dependencies = [
    "anthropic",
    "typesafe-sdk",
    "python-dotenv",
    "typer",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
router = "router.cli:app"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
